<h2>Восстановление пароля</h2>

<p>Вы запросили восстановление пароля. Перейдите по ссылке, чтобы придумать новый пароль:</p>

<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">Придумать новый пароль</a></p>

<p>Ссылка действует 1 час и срабатывает один раз. Если вы не запрашивали восстановление, просто проигнорируйте это письмо.</p>
